name: Fix financeiro sheet once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fix-financeiro-sheet.mjs
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NiilAppCore.jsx Financeiro.jsx FinanceiroStart.jsx niil-runtime.js package.json vite.persistencia.js
          git commit -m "Estabilizar onboarding financeiro e remover remendos"
          git push origin HEAD:main
