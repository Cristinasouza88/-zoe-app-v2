name: Ajuste contas onboarding once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  ajustar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retirar nome manual da conta
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('FinanceiroStart.jsx')
          s = p.read_text()

          trocas = [
            (
              "const[conta,setConta]=useState({nome:'',instituicao:'',tipo:'Conta corrente',saldoAtual:'',dataSaldo:hoje(),disponibilidadeImediata:true});",
              "const[conta,setConta]=useState({instituicao:'',tipo:'Conta corrente',saldoAtual:'',dataSaldo:hoje(),disponibilidadeImediata:true});"
            ),
            (
              "const addConta=()=>{if(!conta.nome.trim())return aviso('Informe o nome da conta.');const saldo=n(conta.saldoAtual);persistir(f=>({...f,contas:[...(f.contas||[]),{id:uid('conta'),nome:conta.nome.trim(),instituicao:conta.instituicao,tipo:conta.tipo,saldoAtual:saldo,valorMoedaBase:saldo,moeda,dataSaldo:conta.dataSaldo||hoje(),disponibilidadeImediata:conta.disponibilidadeImediata!==false,ativa:true}]}));setConta({nome:'',instituicao:'',tipo:'Conta corrente',saldoAtual:'',dataSaldo:hoje(),disponibilidadeImediata:true})};",
              "const addConta=()=>{if(!conta.instituicao)return aviso('Selecione a instituição.');const saldo=n(conta.saldoAtual),nomeAutomatico=conta.instituicao||conta.tipo;persistir(f=>({...f,contas:[...(f.contas||[]),{id:uid('conta'),nome:nomeAutomatico,instituicao:conta.instituicao,tipo:conta.tipo,saldoAtual:saldo,valorMoedaBase:saldo,moeda,dataSaldo:conta.dataSaldo||hoje(),disponibilidadeImediata:conta.disponibilidadeImediata!==false,ativa:true}]}));setConta({instituicao:'',tipo:'Conta corrente',saldoAtual:'',dataSaldo:hoje(),disponibilidadeImediata:true})};"
            ),
            (
              "<Field label=\"Nome da conta\"><input value={conta.nome} onChange={e=>setConta({...conta,nome:e.target.value})}/></Field>",
              ""
            ),
            (
              "item={x} valor={x.saldoAtual} sub={`${x.instituicao||x.tipo} · ${x.tipo}`}",
              "item={{...x,nome:x.instituicao||x.nome||x.tipo}} valor={x.saldoAtual} sub={x.tipo}"
            )
          ]

          for antigo, novo in trocas:
            if antigo not in s:
              raise SystemExit(f'Trecho esperado não encontrado: {antigo[:80]}')
            s = s.replace(antigo, novo, 1)

          p.write_text(s)
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FinanceiroStart.jsx
          git commit -m "Simplificar cadastro de contas no onboarding"
          git push origin HEAD:main
