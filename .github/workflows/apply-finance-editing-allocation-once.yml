name: Apply finance editing allocation once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply requested finance behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('Financeiro.jsx')
          s=p.read_text()

          def replace_once(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'pattern not found: {label}')
              s=s.replace(old,new,1)

          old="""  const salvarTransacao=()=>{\n    const m=modal?.data||{},v=Math.abs(Number(String(m.valor||'').replace(',','.'))||0);\n    if(!v||!String(m.descricaoOriginal||'').trim())return aviso('Informe descrição e valor.');\n    let tipo=m.tipo==='receita'?'receita':'despesa';const natureza=m.natureza||'normal';if(natureza==='resgate'||natureza==='estorno')tipo='receita';\n    const tx=classificarTransacao({...m,id:uid('tx'),valor:v,valorMoedaBase:v,moeda:fin.configuracao?.moedaBase||'BRL',tipo,data:m.data||hoje(),origem:'manual',status:'confirmado',transferenciaInterna:natureza==='transferencia',pagamentoFatura:natureza==='fatura',aporteInvestimento:natureza==='aporte',resgateInvestimento:natureza==='resgate',estorno:natureza==='estorno'},fin.regrasClassificacao);\n    agir(f=>({...f,onboardingConcluido:true,transacoes:[...f.transacoes,tx]}));setMesRef(tx.data.slice(0,7));if(m.voltarPara)setModal({tipo:m.voltarPara,data:{}});else fechar();aviso('Lançamento salvo');\n  };"""
          new="""  const salvarTransacao=()=>{\n    const m=modal?.data||{},v=Math.abs(Number(String(m.valor||'').replace(',','.'))||0);\n    if(!v||!String(m.descricaoOriginal||'').trim())return aviso('Informe descrição e valor.');\n    let tipo=m.tipo==='receita'?'receita':'despesa';const natureza=m.natureza||'normal';if(natureza==='resgate'||natureza==='estorno')tipo='receita';\n    const{voltarPara,...dados}=m,anterior=m.id?fin.transacoes.find(x=>x.id===m.id):null,id=m.id||uid('tx');\n    const tx=classificarTransacao({...anterior,...dados,id,valor:v,valorMoedaBase:v,moeda:fin.configuracao?.moedaBase||'BRL',tipo,data:m.data||hoje(),origem:m.origem||anterior?.origem||'manual',status:'confirmado',transferenciaInterna:natureza==='transferencia',pagamentoFatura:natureza==='fatura',aporteInvestimento:natureza==='aporte',resgateInvestimento:natureza==='resgate',estorno:natureza==='estorno'},fin.regrasClassificacao);\n    agir(f=>({...f,onboardingConcluido:true,transacoes:m.id?f.transacoes.map(x=>x.id===m.id?tx:x):[...f.transacoes,tx]}));setMesRef(tx.data.slice(0,7));if(voltarPara)setModal({tipo:voltarPara,data:{}});else fechar();aviso(m.id?'Lançamento atualizado':'Lançamento salvo');\n  };"""
          replace_once(old,new,'salvarTransacao')

          anchor="  const ajustarCategoriaTx=(id,categoria)=>agir(f=>({...f,transacoes:f.transacoes.map(x=>x.id===id?{...x,categoria,status:'confirmado',revisar:false,revisadoUsuario:true,confiancaClassificacao:1}:x)}));\n"
          extra="""  const excluirTransacao=(id,voltarPara)=>{if(typeof window!=='undefined'&&!window.confirm('Excluir este lançamento?'))return;persistir(f=>({...f,transacoes:f.transacoes.filter(x=>x.id!==id)}));setModal({tipo:voltarPara,data:{}});aviso('Lançamento excluído')};\n  const salvarReceitaRecorrente=()=>{const m=modal?.data||{},nome=String(m.nome||'').trim(),valor=Math.abs(Number(String(m.valorMensal||'').replace(',','.'))||0);if(!nome||!valor)return aviso('Informe nome e valor da receita.');const item={...(fin.receitasRecorrentes||[]).find(x=>x.id===m.id),id:m.id||uid('rec'),nome,categoria:m.categoria||'Salário',valorMensal:valor,ativo:true};persistir(f=>({...f,receitasRecorrentes:m.id?(f.receitasRecorrentes||[]).map(x=>x.id===m.id?item:x):[...(f.receitasRecorrentes||[]),item]}));setModal({tipo:'receitasMes',data:{}});aviso(m.id?'Receita atualizada':'Receita adicionada')};\n  const excluirReceitaRecorrente=id=>{if(typeof window!=='undefined'&&!window.confirm('Excluir esta receita recorrente?'))return;persistir(f=>({...f,receitasRecorrentes:(f.receitasRecorrentes||[]).filter(x=>x.id!==id)}));setModal({tipo:'receitasMes',data:{}});aviso('Receita excluída')};\n  const salvarGastoFixo=()=>{const m=modal?.data||{},nome=String(m.nome||'').trim(),valor=Math.abs(Number(String(m.valorMensal||'').replace(',','.'))||0);if(!nome||!valor)return aviso('Informe nome e valor da despesa.');const item={...(fin.gastosFixos||[]).find(x=>x.id===m.id),id:m.id||uid('fix'),nome,categoria:m.categoria||'Outros',valorMensal:valor,ativo:true};persistir(f=>({...f,gastosFixos:m.id?(f.gastosFixos||[]).map(x=>x.id===m.id?item:x):[...(f.gastosFixos||[]),item]}));setModal({tipo:'despesasMes',data:{}});aviso(m.id?'Despesa atualizada':'Despesa adicionada')};\n  const excluirGastoFixo=id=>{if(typeof window!=='undefined'&&!window.confirm('Excluir esta despesa recorrente?'))return;persistir(f=>({...f,gastosFixos:(f.gastosFixos||[]).filter(x=>x.id!==id)}));setModal({tipo:'despesasMes',data:{}});aviso('Despesa excluída')};\n  const definirPercentualCaixinha=(destinoId,valorPct)=>{const positiva=Math.max(0,Number(resumo.resultado||0)),pct=Math.max(0,Math.min(100,Number(String(valorPct||'0').replace(',','.'))||0));if(!positiva)return;const novoValor=positiva*pct/100,outras=alocacoesMes.filter(a=>!(a.destinoTipo==='caixinha'&&a.destinoId===destinoId)),totalOutras=outras.reduce((a,x)=>a+Number(x.valor||0),0);if(totalOutras+novoValor>positiva+.01)return aviso('A soma das porcentagens não pode passar de 100%.');persistir(f=>{const base=(f.alocacoesSobra||[]).filter(a=>!(a.mes===mesRef&&a.destinoTipo==='caixinha'&&a.destinoId===destinoId));return{...f,alocacoesSobra:pct>0?[...base,{id:uid('aloc'),mes:mesRef,data:hoje(),valor:novoValor,percentual:pct,destinoTipo:'caixinha',destinoId}]:base}})};\n"""
          replace_once(anchor,anchor+extra,'helper functions')

          rev_old="""<label>Reconhecer como<select value={t.categoria||'Outros'} onChange={e=>ajustarCategoriaTx(t.id,e.target.value)}>{CATEGORIAS_RECEITA.map(c=><option key={c}>{c}</option>)}</select></label></div>"""
          rev_new="""<label>Reconhecer como<select value={t.categoria||'Outros'} onChange={e=>ajustarCategoriaTx(t.id,e.target.value)}>{CATEGORIAS_RECEITA.map(c=><option key={c}>{c}</option>)}</select></label><div className=\"fx2-match-actions\"><button type=\"button\" onClick={()=>abrir('transacao',{...t,valor:String(t.valor||''),voltarPara:'receitasMes'})}>Alterar</button><button type=\"button\" className=\"danger\" onClick={()=>excluirTransacao(t.id,'receitasMes')}>Excluir</button></div></div>"""
          replace_once(rev_old,rev_new,'revenue row actions')

          exp_old="""<label>Reconhecer como<select value={t.categoria||'Outros'} onChange={e=>ajustarCategoriaTx(t.id,e.target.value)}>{CATEGORIAS_DESPESA.map(c=><option key={c}>{c}</option>)}</select></label></div>"""
          exp_new="""<label>Reconhecer como<select value={t.categoria||'Outros'} onChange={e=>ajustarCategoriaTx(t.id,e.target.value)}>{CATEGORIAS_DESPESA.map(c=><option key={c}>{c}</option>)}</select></label><div className=\"fx2-match-actions\"><button type=\"button\" onClick={()=>abrir('transacao',{...t,valor:String(t.valor||''),voltarPara:'despesasMes'})}>Alterar</button><button type=\"button\" className=\"danger\" onClick={()=>excluirTransacao(t.id,'despesasMes')}>Excluir</button></div></div>"""
          replace_once(exp_old,exp_new,'expense row actions')

          rec_old="""<div className=\"fx2-sheet-ref\" key={r.id}><span>{r.nome}<small>{r.categoria||'Renda mensal'}</small></span><strong><Money value={r.valorMensal} hidden={hidden}/></strong></div>"""
          rec_new="""<div className=\"fx2-sheet-ref editable\" key={r.id}><span>{r.nome}<small>{r.categoria||'Renda mensal'}</small></span><strong><Money value={r.valorMensal} hidden={hidden}/></strong><div className=\"fx2-mini-actions\"><button onClick={()=>abrir('receitaRecorrente',{...r})}>Alterar</button><button className=\"danger\" onClick={()=>excluirReceitaRecorrente(r.id)}>Excluir</button></div></div>"""
          replace_once(rec_old,rec_new,'recurring revenue actions')

          fix_old="""<div className=\"fx2-sheet-ref\" key={g.id}><span>{g.nome}<small>{g.categoria||'Gasto mensal'}</small></span><strong><Money value={g.valorMensal} hidden={hidden}/></strong></div>"""
          fix_new="""<div className=\"fx2-sheet-ref editable\" key={g.id}><span>{g.nome}<small>{g.categoria||'Gasto mensal'}</small></span><strong><Money value={g.valorMensal} hidden={hidden}/></strong><div className=\"fx2-mini-actions\"><button onClick={()=>abrir('gastoFixo',{...g})}>Alterar</button><button className=\"danger\" onClick={()=>excluirGastoFixo(g.id)}>Excluir</button></div></div>"""
          replace_once(fix_old,fix_new,'fixed expense actions')

          # Replace the surplus sheet with direct percentage allocation across the user's own boxes.
          pattern=r"    if\(modal\.tipo==='sobraMes'\)\{.*?return <Sheet title=\{`Organizar sobra · \$\{rotuloMes\(mesRef\)\}`\} onClose=\{fechar\}>.*?</Sheet>\}\n"
          replacement="""    if(modal.tipo==='sobraMes'){const positiva=Math.max(0,Number(resumo.resultado||0)),pctDistribuido=positiva?Math.min(100,totalAlocado/positiva*100):0;return <Sheet title={`Organizar sobra · ${rotuloMes(mesRef)}`} onClose={fechar}><div className=\"fx2-surplus-source\"><span>Valor que sobrou no mês</span><strong><Money value={positiva} hidden={hidden}/></strong><small>Distribua por porcentagem entre as suas caixinhas. O que você não distribuir continua na conta.</small></div>{positiva>0?<><div className=\"fx2-sheet-section-title\"><b>Distribuição da sobra</b><button className=\"fx2-link\" onClick={()=>abrir('novaCaixinha',{voltarPara:'sobraMes'})}>+ Nova caixinha</button></div>{caixinhasAtivas.length?<div className=\"fx2-allocation-list\">{caixinhasAtivas.map(c=>{const valor=alocadoNaCaixinhaMes(c.id),pct=positiva?valor/positiva*100:0;return <div className=\"fx2-allocation-row\" key={c.id}><div className=\"fx2-allocation-name\"><PiggyBank size={20}/><span><b>{c.nome}</b><small>{c.descricao||'Sua caixinha'}</small></span></div><div className=\"fx2-allocation-pct\"><input type=\"number\" min=\"0\" max=\"100\" step=\"1\" inputMode=\"decimal\" value={Number(pct.toFixed(2))} onChange={e=>definirPercentualCaixinha(c.id,e.target.value)}/><span>%</span></div><div className=\"fx2-allocation-value\"><strong><Money value={valor} hidden={hidden}/></strong><small>Total na caixinha: <Money value={saldoPlanejadoCaixinha(c.id)} hidden={hidden}/></small></div></div>})}</div>:<div className=\"fx2-empty-mini\">Você ainda não criou nenhuma caixinha.</div>}<div className=\"fx2-allocation-summary\"><div><span>Distribuído</span><strong>{pctDistribuido.toFixed(0)}%</strong><small><Money value={totalAlocado} hidden={hidden}/></small></div><div className=\"remain\"><span>Fica na conta</span><strong><Money value={sobraLivre} hidden={hidden}/></strong><small>{Math.max(0,100-pctDistribuido).toFixed(0)}% da sobra</small></div></div></>:<div className=\"fx2-alert\">Não há sobra positiva neste mês para organizar.</div>}</Sheet>}\n"""
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'surplus sheet replace count={n}')
          s=s2

          modal_anchor="    if(modal.tipo==='novaCaixinha')return <Sheet title=\"Nova caixinha\""
          if modal_anchor not in s:
              raise SystemExit('modal insertion anchor not found')
          modals="""    if(modal.tipo==='receitaRecorrente')return <Sheet title={m.id?'Alterar receita':'Nova receita recorrente'} onClose={()=>setModal({tipo:'receitasMes',data:{}})}><Field label=\"Nome\">{input('nome',{placeholder:'Ex.: Salário, comissão'})}</Field><Field label=\"Tipo de receita\"><select value={m.categoria||'Salário'} onChange={e=>atualizarModal({categoria:e.target.value})}>{CATEGORIAS_RECEITA.map(c=><option key={c}>{c}</option>)}</select></Field><Field label=\"Valor mensal\">{input('valorMensal',{inputMode:'decimal',placeholder:'0,00'})}</Field><button className=\"fx2-btn wide\" onClick={salvarReceitaRecorrente}>SALVAR ALTERAÇÃO</button></Sheet>;\n    if(modal.tipo==='gastoFixo')return <Sheet title={m.id?'Alterar despesa':'Nova despesa recorrente'} onClose={()=>setModal({tipo:'despesasMes',data:{}})}><Field label=\"Nome\">{input('nome',{placeholder:'Ex.: Aluguel, academia'})}</Field><Field label=\"Categoria\"><select value={m.categoria||'Outros'} onChange={e=>atualizarModal({categoria:e.target.value})}>{CATEGORIAS_DESPESA.map(c=><option key={c}>{c}</option>)}</select></Field><Field label=\"Valor mensal\">{input('valorMensal',{inputMode:'decimal',placeholder:'0,00'})}</Field><button className=\"fx2-btn wide\" onClick={salvarGastoFixo}>SALVAR ALTERAÇÃO</button></Sheet>;\n"""
          s=s.replace(modal_anchor,modals+modal_anchor,1)

          s=s.replace("if(modal.tipo==='transacao')return <Sheet title=\"Novo lançamento\"", "if(modal.tipo==='transacao')return <Sheet title={m.id?'Alterar lançamento':'Novo lançamento'}",1)

          p.write_text(s)

          css=Path('Financeiro.css')
          c=css.read_text()
          marker='/* NIIL allocation percentage + inline edit actions */'
          if marker not in c:
              c += '''\n\n/* NIIL allocation percentage + inline edit actions */\n.fx2-match-actions,.fx2-mini-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:9px}.fx2-match-actions button,.fx2-mini-actions button{border:1px solid #ded8eb;background:#fff;color:#493c68;border-radius:10px;padding:7px 10px;font-size:10px;font-weight:800}.fx2-match-actions button.danger,.fx2-mini-actions button.danger{color:#c44848;border-color:#f0d4d4;background:#fffafa}.fx2-sheet-ref.editable{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:center}.fx2-sheet-ref.editable .fx2-mini-actions{grid-column:1/-1;margin-top:2px}.fx2-surplus-source{padding:16px;border-radius:18px;background:linear-gradient(145deg,#f2eefb,#fbfaff);border:1px solid #e5def2;margin-bottom:15px}.fx2-surplus-source span{display:block;font-size:11px;color:#716a80;font-weight:700}.fx2-surplus-source strong{display:block;font-size:28px;color:#2f2545;margin:4px 0}.fx2-surplus-source small{display:block;color:#817a8c;line-height:1.35}.fx2-allocation-list{display:flex;flex-direction:column;gap:10px}.fx2-allocation-row{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:8px 12px;padding:13px;border:1px solid #e5e0ec;border-radius:16px;background:#fff}.fx2-allocation-name{display:flex;gap:9px;align-items:center;min-width:0;color:#3a3151}.fx2-allocation-name span{min-width:0}.fx2-allocation-name b,.fx2-allocation-name small{display:block}.fx2-allocation-name small{font-size:9px;color:#8b8495;margin-top:2px}.fx2-allocation-pct{display:flex;align-items:center;justify-content:flex-end;gap:4px}.fx2-allocation-pct input{width:56px;border:1px solid #dcd5e8;border-radius:10px;padding:8px 6px;text-align:center;font-weight:800;color:#342a4a;background:#faf9fd}.fx2-allocation-pct span{font-size:11px;font-weight:800;color:#6d6480}.fx2-allocation-value{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;align-items:flex-end;padding-top:8px;border-top:1px solid #f0edf4}.fx2-allocation-value strong{font-size:13px;color:#2f2545}.fx2-allocation-value small{font-size:8px;color:#8b8495;text-align:right}.fx2-allocation-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.fx2-allocation-summary>div{padding:12px;border-radius:14px;background:#f7f4fb;border:1px solid #e7e1ef}.fx2-allocation-summary>div.remain{background:#eef8f3;border-color:#d7eee1}.fx2-allocation-summary span,.fx2-allocation-summary strong,.fx2-allocation-summary small{display:block}.fx2-allocation-summary span{font-size:9px;color:#81798c}.fx2-allocation-summary strong{font-size:16px;color:#342a4a;margin:3px 0}.fx2-allocation-summary small{font-size:8px;color:#8b8495}\n'''
          css.write_text(c)
          PY
      - run: npm install
      - run: npm run build
      - name: Commit patch and remove one-time workflow
        run: |
          rm .github/workflows/apply-finance-editing-allocation-once.yml
          git config user.name "Cristinasouza88"
          git config user.email "94078152+Cristinasouza88@users.noreply.github.com"
          git add Financeiro.jsx Financeiro.css .github/workflows/apply-finance-editing-allocation-once.yml
          git commit -m "Ajustar edição de receitas despesas e distribuição por porcentagem"
          git push
