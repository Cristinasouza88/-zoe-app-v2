name: Fix finance syntax validate and restore
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python scripts/fix-nova-caixinha-syntax.py
      - run: npm install
      - run: npm run build
      - run: |
          cat > .github/workflows/verify-build.yml <<'YAML'
          name: Verify build
          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
            workflow_dispatch:
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 20
                - run: npm install
                - run: npm run build
          YAML
          rm -f scripts/fix-nova-caixinha-syntax.py .github/build-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Financeiro.jsx .github/workflows/verify-build.yml scripts/fix-nova-caixinha-syntax.py .github/build-trigger.txt
          git diff --cached --quiet || git commit -m "Corrigir sintaxe dos sheets financeiros"
          git push
