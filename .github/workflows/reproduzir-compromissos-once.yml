name: Reproduzir compromissos once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  ajustar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Aplicar patch
        run: python scripts/patch-compromissos-once.py
      - name: Verificar build
        run: |
          npm install
          npm run build
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FinanceiroStart.jsx FinanceiroStart.css
          git commit -m "Reproduzir painel de compromissos e parcelas"
          git push origin HEAD:main
