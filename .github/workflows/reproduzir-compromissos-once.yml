name: Reproduzir compromissos once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  ajustar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Aplicar nova interface de compromissos
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('FinanceiroStart.jsx')
          s = p.read_text()

          s = s.replace(
            "import{WalletCards,Coins,ReceiptText,Landmark,HandCoins,Check,Plus,Trash2,LockKeyhole,X,TrendingUp,Building2,Sparkles,PiggyBank,Target,BookOpen}from'lucide-react';",
            "import{WalletCards,Coins,ReceiptText,Landmark,HandCoins,Check,Plus,Trash2,LockKeyhole,X,TrendingUp,Building2,Sparkles,PiggyBank,Target,BookOpen,FileText,CalendarDays,Percent,CircleDollarSign,Clock3,AlertTriangle,Save,ShieldCheck,BarChart3}from'lucide-react';"
          )

          s = re.sub(
            r"const emptyDivida=.*?;\nconst soma=",
            """const emptyDivida=(tipo='Financiamento imobiliário - imóvel pronto')=>({nome:'',tipo,instituicao:'',valorOriginal:'',saldoDevedor:'',valorParcela:'',parcelasRestantes:'',prazoMeses:'',taxaJurosAnual:'',percentualObra:'',inicioAmortizacao:'nao_iniciado',dataAtualizacaoObra:hoje(),prazoContratual:'',toleranciaDias:'180',dataInicioReembolso:'',indenizacaoMensal:'1',amortizacaoMensal:'',jurosMensal:'',evolucaoObraMensal:'',seguroMensal:'',taxasMensais:'',outrosNaoAmortizamMensal:'',cartaCredito:'',lancePago:'',taxaAdministracaoMensal:'',fundoReservaMensal:'',contemplado:'nao'});
const categoriaDivida=t=>String(t||'').startsWith('Financiamento imobiliário')?'Financiamento imobiliário':t;
const situacaoImovel=t=>String(t||'').includes('em construção')?'construcao':'pronto';
const tipoImovel=sit=>sit==='construcao'?'Financiamento imobiliário - em construção':'Financiamento imobiliário - imóvel pronto';
const addDias=(ym,dias)=>{if(!ym)return'';const[d,m]=ym.includes('-')?[ym.split('-')[0],ym.split('-')[1]]:['',''];if(!d||!m)return'';const dt=new Date(Number(d),Number(m)-1,1);dt.setDate(dt.getDate()+Number(dias||0));return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`};
const fmtData=v=>{if(!v)return'—';const p=String(v).split('-');if(p.length<2)return v;return p.length===2?`${p[1]}/${p[0]}`:`${p[2]}/${p[1]}/${p[0]}`};
const soma=""",
            s,
            count=1,
            flags=re.S
          )

          old_add = re.search(r" const addDivida=\(\)=>\{.*?\};\n const marcarSem=", s, re.S)
          if not old_add:
            raise SystemExit('addDivida não encontrado')
          new_add = """ const addDivida=()=>{const tipo=divida.tipo,consorcio=tipo.startsWith('Consórcio'),saldo=n(divida.saldoDevedor),carta=n(divida.cartaCredito);if(!divida.nome.trim())return aviso('Informe o nome do compromisso.');if(!divida.instituicao)return aviso('Selecione a instituição.');if(consorcio&&!carta)return aviso('Informe o valor da carta de crédito.');if(!consorcio&&!saldo)return aviso('Informe o saldo devedor atual.');const parcela=n(divida.valorParcela);persistir(f=>({...f,dividas:[...(f.dividas||[]),{id:uid('div'),nome:divida.nome.trim(),tipo,instituicao:divida.instituicao,valorOriginal:n(divida.valorOriginal),saldoDevedor:consorcio?Math.max(0,n(divida.valorOriginal)||carta):saldo,saldoDevedorMoedaBase:consorcio?Math.max(0,n(divida.valorOriginal)||carta):saldo,valorParcela:parcela,valorParcelaMoedaBase:parcela,parcelasRestantes:Number(divida.parcelasRestantes||0),prazoMeses:Number(divida.prazoMeses||0),taxaJurosAnual:n(divida.taxaJurosAnual),percentualObra:n(divida.percentualObra),inicioAmortizacao:divida.inicioAmortizacao||'nao_iniciado',dataAtualizacaoObra:divida.dataAtualizacaoObra||hoje(),prazoContratual:divida.prazoContratual||'',toleranciaDias:Number(divida.toleranciaDias||180),dataFimTolerancia:addDias(divida.prazoContratual,divida.toleranciaDias||180),dataInicioReembolso:divida.dataInicioReembolso||'',indenizacaoMensal:n(divida.indenizacaoMensal||1),amortizacaoMensal:consorcio?0:n(divida.amortizacaoMensal),jurosMensal:consorcio?0:n(divida.jurosMensal),evolucaoObraMensal:tipo.includes('em construção')?n(divida.evolucaoObraMensal):0,seguroMensal:n(divida.seguroMensal),taxasMensais:n(divida.taxasMensais),outrosNaoAmortizamMensal:n(divida.outrosNaoAmortizamMensal),cartaCredito:carta,lancePago:n(divida.lancePago),taxaAdministracaoMensal:n(divida.taxaAdministracaoMensal),fundoReservaMensal:n(divida.fundoReservaMensal),contemplado:divida.contemplado,moeda,ativa:true}]}));setDivida(emptyDivida(tipo))};
 const marcarSem="""
          s = s[:old_add.start()] + new_add + s[old_add.end():]

          old_comp = re.search(r" const compromissoCampos=\(\)=>\{.*?\};\n\n const Conteudo=", s, re.S)
          if not old_comp:
            raise SystemExit('compromissoCampos não encontrado')
          new_comp = r''' const compromissoCampos=()=>{
  const t=divida.tipo,grupo=categoriaDivida(t),imovel=grupo==='Financiamento imobiliário',obra=imovel&&situacaoImovel(t)==='construcao',cons=t.startsWith('Consórcio'),veiculo=t.includes('veículo');
  const fimTolerancia=addDias(divida.prazoContratual,divida.toleranciaDias||180),atrasado=obra&&fimTolerancia&&new Date(fimTolerancia+'T23:59:59')<new Date();
  const pct=Math.max(0,Math.min(100,n(divida.percentualObra)));
  const trocarGrupo=v=>{if(v==='Financiamento imobiliário')setDivida(emptyDivida('Financiamento imobiliário - imóvel pronto'));else setDivida(emptyDivida(v))};
  return <div className="fxcommit">
   {imovel&&<div className="fxcommit-info"><span className="fxcommit-info-icon"><FileText size={18}/></span><div>Para financiamento imobiliário, a tela muda conforme a fase do imóvel. Em obra, mostramos evolução da obra, atraso e ressarcimentos.</div></div>}
   <section className="fxcommit-section"><h4><FileText size={17}/> 1. Identificação</h4><Field label="Nome do compromisso"><input value={divida.nome} onChange={e=>setDivida({...divida,nome:e.target.value})} placeholder={cons?'Ex.: consórcio do apartamento':'Ex.: Apartamento Guedala Park II'}/></Field><div className={imovel?'fxstart-grid2':''}><Field label="Tipo"><select value={grupo} onChange={e=>trocarGrupo(e.target.value)}><option>Financiamento imobiliário</option><option>Financiamento de veículo</option><option>Consórcio imobiliário</option><option>Consórcio de veículo</option><option>Empréstimo</option><option>Parcelamento</option><option>Outro compromisso</option></select></Field>{imovel&&<Field label="Situação do imóvel"><select value={situacaoImovel(t)} onChange={e=>setDivida({...divida,tipo:tipoImovel(e.target.value)})}><option value="pronto">Imóvel pronto</option><option value="construcao">Em construção</option></select></Field>}</div><BankSelect value={divida.instituicao} onChange={v=>setDivida({...divida,instituicao:v})}/></section>
   {imovel?<>
    <section className="fxcommit-section"><h4><WalletCards size={17}/> 2. Resumo do financiamento</h4><div className="fxcommit-metrics"><label className="fxcommit-metric"><span><CircleDollarSign size={19}/> Valor financiado</span><input inputMode="decimal" value={divida.valorOriginal} onChange={e=>setDivida({...divida,valorOriginal:e.target.value})} placeholder="R$ 0,00"/></label><label className="fxcommit-metric highlight"><span><CircleDollarSign size={19}/> Saldo devedor atual</span><input inputMode="decimal" value={divida.saldoDevedor} onChange={e=>setDivida({...divida,saldoDevedor:e.target.value})} placeholder="R$ 0,00"/></label><label className="fxcommit-metric"><span><CalendarDays size={19}/> Prazo</span><div className="fxcommit-inline"><input type="number" value={divida.prazoMeses} onChange={e=>setDivida({...divida,prazoMeses:e.target.value})} placeholder="420"/><em>meses</em></div></label><label className="fxcommit-metric"><span><Percent size={19}/> Taxa de juros</span><div className="fxcommit-inline"><input inputMode="decimal" value={divida.taxaJurosAnual} onChange={e=>setDivida({...divida,taxaJurosAnual:e.target.value})} placeholder="7,66"/><em>% a.a.</em></div></label></div><div className="fxcommit-secondary"><Field label={`Parcela mensal (${moeda})`}><input inputMode="decimal" value={divida.valorParcela} onChange={e=>setDivida({...divida,valorParcela:e.target.value})}/></Field><Field label="Parcelas restantes"><input type="number" value={divida.parcelasRestantes} onChange={e=>setDivida({...divida,parcelasRestantes:e.target.value})}/></Field></div></section>
    {obra&&<><section className="fxcommit-section"><h4><BarChart3 size={17}/> 3. Evolução da obra</h4><div className="fxcommit-progress-head"><strong>{pct.toLocaleString('pt-BR',{maximumFractionDigits:2})}% concluída</strong><label><input inputMode="decimal" value={divida.percentualObra} onChange={e=>setDivida({...divida,percentualObra:e.target.value})} placeholder="0"/>%</label></div><div className="fxcommit-progress"><i style={{width:`${pct}%`}}/></div><div className="fxcommit-meta"><Field label="Início da amortização"><select value={divida.inicioAmortizacao} onChange={e=>setDivida({...divida,inicioAmortizacao:e.target.value})}><option value="nao_iniciado">Não iniciado</option><option value="iniciado">Iniciado</option></select></Field><Field label="Última atualização"><input type="date" value={divida.dataAtualizacaoObra} onChange={e=>setDivida({...divida,dataAtualizacaoObra:e.target.value})}/></Field></div><Field label={`Evolução de obra atual/mês (${moeda})`}><input inputMode="decimal" value={divida.evolucaoObraMensal} onChange={e=>setDivida({...divida,evolucaoObraMensal:e.target.value})}/></Field></section>
    <section className="fxcommit-section"><h4><Clock3 size={17}/> 4. Atraso e ressarcimentos</h4><div className="fxcommit-delay-grid"><Field label="Prazo contratual"><input type="month" value={divida.prazoContratual} onChange={e=>setDivida({...divida,prazoContratual:e.target.value})}/></Field><Field label="Tolerância contratual (dias)"><input type="number" value={divida.toleranciaDias} onChange={e=>setDivida({...divida,toleranciaDias:e.target.value})}/></Field><div className="fxcommit-delay-card"><span>Fim da tolerância</span><b>{fmtData(fimTolerancia)}</b></div><div className={`fxcommit-delay-card status ${atrasado?'late':'ok'}`}><span>Status</span><b>{fimTolerancia?(atrasado?'Atrasado':'No prazo'):'A definir'}</b></div></div><div className="fxcommit-legal"><label><ShieldCheck size={17}/><span>Reembolso da evolução de obra</span><input type="month" value={divida.dataInicioReembolso} onChange={e=>setDivida({...divida,dataInicioReembolso:e.target.value})}/></label><label><CircleDollarSign size={17}/><span>Indenização por atraso</span><div className="fxcommit-inline small"><input inputMode="decimal" value={divida.indenizacaoMensal} onChange={e=>setDivida({...divida,indenizacaoMensal:e.target.value})}/><em>% ao mês</em></div></label></div><div className="fxcommit-disclaimer"><AlertTriangle size={14}/> Estimativas para organização pessoal. Confira prazos, tolerância e direitos no seu contrato e com orientação jurídica quando necessário.</div></section></>}
   </>:cons?<section className="fxcommit-section"><h4><WalletCards size={17}/> 2. Resumo do consórcio</h4><div className="fxstart-grid2"><Field label="Carta de crédito"><input inputMode="decimal" value={divida.cartaCredito} onChange={e=>setDivida({...divida,cartaCredito:e.target.value})}/></Field><Field label="Parcela mensal"><input inputMode="decimal" value={divida.valorParcela} onChange={e=>setDivida({...divida,valorParcela:e.target.value})}/></Field><Field label="Parcelas restantes"><input type="number" value={divida.parcelasRestantes} onChange={e=>setDivida({...divida,parcelasRestantes:e.target.value})}/></Field><Field label="Lance já pago"><input inputMode="decimal" value={divida.lancePago} onChange={e=>setDivida({...divida,lancePago:e.target.value})}/></Field><Field label="Taxa de administração/mês"><input inputMode="decimal" value={divida.taxaAdministracaoMensal} onChange={e=>setDivida({...divida,taxaAdministracaoMensal:e.target.value})}/></Field><Field label="Fundo de reserva/mês"><input inputMode="decimal" value={divida.fundoReservaMensal} onChange={e=>setDivida({...divida,fundoReservaMensal:e.target.value})}/></Field></div><Field label="Contemplado?"><select value={divida.contemplado} onChange={e=>setDivida({...divida,contemplado:e.target.value})}><option value="nao">Ainda não</option><option value="sim">Sim</option></select></Field></section>:<section className="fxcommit-section"><h4><WalletCards size={17}/> 2. Resumo do compromisso</h4><div className="fxstart-grid2"><Field label="Valor original"><input inputMode="decimal" value={divida.valorOriginal} onChange={e=>setDivida({...divida,valorOriginal:e.target.value})}/></Field><Field label="Saldo devedor"><input inputMode="decimal" value={divida.saldoDevedor} onChange={e=>setDivida({...divida,saldoDevedor:e.target.value})}/></Field><Field label="Parcela mensal"><input inputMode="decimal" value={divida.valorParcela} onChange={e=>setDivida({...divida,valorParcela:e.target.value})}/></Field><Field label="Parcelas restantes"><input type="number" value={divida.parcelasRestantes} onChange={e=>setDivida({...divida,parcelasRestantes:e.target.value})}/></Field></div><h4 className="fxcommit-subtitle">Composição mensal</h4><div className="fxstart-grid2"><Field label="Amortização"><input inputMode="decimal" value={divida.amortizacaoMensal} onChange={e=>setDivida({...divida,amortizacaoMensal:e.target.value})}/></Field><Field label="Juros"><input inputMode="decimal" value={divida.jurosMensal} onChange={e=>setDivida({...divida,jurosMensal:e.target.value})}/></Field><Field label="Seguro"><input inputMode="decimal" value={divida.seguroMensal} onChange={e=>setDivida({...divida,seguroMensal:e.target.value})}/></Field><Field label="Taxas"><input inputMode="decimal" value={divida.taxasMensais} onChange={e=>setDivida({...divida,taxasMensais:e.target.value})}/></Field>{!veiculo&&<Field label="Outros que não amortizam"><input inputMode="decimal" value={divida.outrosNaoAmortizamMensal} onChange={e=>setDivida({...divida,outrosNaoAmortizamMensal:e.target.value})}/></Field>}</div></section>}
  </div>
 };

 const Conteudo='''
          s = s[:old_comp.start()] + new_comp + s[old_comp.end():]

          old_step = re.search(r"  if\(step===5\)return .*?;\n  if\(step===6\)return", s, re.S)
          if not old_step:
            raise SystemExit('step 5 não encontrado')
          new_step = r'''  if(step===5)return <><Box><h4>Compromissos e parcelas</h4>{compromissoCampos()}<button className="fxcommit-save" onClick={addDivida}><Save size={17}/> SALVAR COMPROMISSO</button></Box><Total label={`${dividas.length} compromisso(s) · saldo total`} value={totalDividas} moeda={moeda} extra={`Parcelas mensais: ${formatoMoeda(totalParcelas,moeda)}`}/><div className="fxstart-list">{dividas.map(x=><Item key={x.id} campo="dividas" item={x} valor={x.saldoDevedor} sub={`${x.tipo}${x.instituicao?` · ${x.instituicao}`:''}`}/>)}</div>{dividas.length>0?<button className="fxstart-btn wide" onClick={proxima}>CONTINUAR</button>:<button className="fxstart-skip" onClick={()=>marcarSem('startSemDividas')}>Não tenho compromissos ou parcelas</button>}</>;
  if(step===6)return'''
          s = s[:old_step.start()] + new_step + s[old_step.end():]
          p.write_text(s)

          css = Path('FinanceiroStart.css')
          c = css.read_text()
          marker = '/* compromisso-ui-v2 */'
          if marker not in c:
            c += r'''
/* compromisso-ui-v2 */
.fxcommit{display:flex;flex-direction:column;gap:12px}.fxcommit-info{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,#F6F8F7,#F1F4F3);border-radius:16px;padding:13px 14px;font-size:11.5px;line-height:1.45;color:var(--ink2)}.fxcommit-info-icon{width:30px;height:30px;border-radius:50%;border:1.5px solid #3ECF8E;color:#25A975;display:grid;place-items:center;flex:0 0 auto}.fxcommit-section{padding:2px 0 0}.fxcommit-section>h4{display:flex;align-items:center;gap:7px;color:var(--ink);font-size:14px!important;font-weight:850!important;margin:4px 0 12px!important}.fxcommit-section>h4 svg{color:#25A975}.fxcommit-metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}.fxcommit-metric{border:1.3px solid #DDE5E3;border-radius:15px;background:#fff;padding:11px 12px;min-height:78px;display:flex;flex-direction:column;justify-content:center}.fxcommit-metric.highlight{background:linear-gradient(145deg,#F2FBF7,#E9F7F1);border-color:#CAE6DA}.fxcommit-metric>span{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:10px;font-weight:700;margin-bottom:4px}.fxcommit-metric>span svg{color:#25A975}.fxcommit-metric input{border:0!important;background:transparent!important;padding:0!important;border-radius:0!important;font-size:18px!important;font-weight:850;color:var(--ink)!important;width:100%;outline:none}.fxcommit-inline{display:flex;align-items:baseline;gap:5px}.fxcommit-inline input{min-width:0}.fxcommit-inline em{font-size:11px;font-style:normal;color:var(--ink2);white-space:nowrap}.fxcommit-inline.small input{width:58px;border:0;background:transparent;font:inherit;font-weight:800;color:var(--ink);text-align:right}.fxcommit-secondary,.fxcommit-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fxcommit-progress-head{display:flex;justify-content:space-between;align-items:center;margin:3px 0 8px;font-size:11px}.fxcommit-progress-head label{display:flex;align-items:center;gap:3px;color:var(--ink3)}.fxcommit-progress-head input{width:56px;border:1px solid var(--line);border-radius:9px;padding:6px 7px;font:inherit;text-align:right}.fxcommit-progress{height:9px;background:#E6E9EC;border-radius:99px;overflow:hidden;margin-bottom:12px}.fxcommit-progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2FB77B,#25A975);transition:width .35s ease}.fxcommit-delay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}.fxcommit-delay-card{border:1px solid var(--line);border-radius:13px;padding:10px 11px;background:#FAFCFB;display:flex;flex-direction:column;justify-content:center;min-height:65px}.fxcommit-delay-card span{font-size:9px;color:var(--ink3);margin-bottom:3px}.fxcommit-delay-card b{font-size:11px;color:var(--ink)}.fxcommit-delay-card.status.late{border-color:#F5CACA;background:#FFF7F7}.fxcommit-delay-card.status.late b{color:#D84A4A}.fxcommit-delay-card.status.ok{border-color:#CAE6DA;background:#F2FBF7}.fxcommit-delay-card.status.ok b{color:#25A975}.fxcommit-legal{display:flex;flex-direction:column;gap:7px;margin-top:8px}.fxcommit-legal>label{display:flex;align-items:center;gap:9px;border-radius:13px;background:linear-gradient(135deg,#EFF9F4,#E9F6F0);padding:10px 12px;color:var(--ink);font-size:10.5px;font-weight:750}.fxcommit-legal>label>svg{color:#25A975;flex:0 0 auto}.fxcommit-legal>label>span{flex:1}.fxcommit-legal input[type=month]{border:0;background:transparent;font:inherit;font-size:10px;color:var(--ink2);width:104px}.fxcommit-disclaimer{display:flex;gap:6px;align-items:flex-start;margin-top:9px;padding:9px 10px;border-radius:11px;background:#FFF9EE;color:#8B6A24;font-size:9px;line-height:1.35}.fxcommit-disclaimer svg{flex:0 0 auto;margin-top:1px}.fxcommit-save{width:100%;border:0;border-radius:16px;padding:14px 18px;background:linear-gradient(135deg,#2FB77B,#25A975);color:#fff;font:inherit;font-size:13px;font-weight:850;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 7px 18px rgba(37,169,117,.18);cursor:pointer}.fxcommit-subtitle{margin-top:4px!important}.fxcommit .niil-bank-picker{margin-top:0!important}
@media(max-width:380px){.fxcommit-metrics,.fxcommit-delay-grid,.fxcommit-secondary,.fxcommit-meta{grid-template-columns:1fr}.fxcommit-metric{min-height:70px}.fxcommit-legal>label{align-items:flex-start;flex-wrap:wrap}.fxcommit-legal input[type=month]{width:100%}}
'''
          css.write_text(c)
          PY
      - name: Verificar build
        run: |
          npm install
          npm run build
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FinanceiroStart.jsx FinanceiroStart.css
          git commit -m "Reproduzir painel de compromissos e parcelas"
          git push origin HEAD:main
