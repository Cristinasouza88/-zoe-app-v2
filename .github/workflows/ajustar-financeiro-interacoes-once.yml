name: Ajustar financeiro interacoes once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  ajustar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ajustar-financeiro-interacoes.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Financeiro.jsx Financeiro.css financeiro.data.js financeiro.core.js
          git diff --cached --quiet || git commit -m "Ajustar navegação e fluxos do painel financeiro"
          git push
